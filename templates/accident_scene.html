        function getSaveServiceUrls() {
            return Array.from(new Set([
                runtimeConfig.saveMeasurementsUrl,
                DEFAULT_SAVE_MEASUREMENTS_URL
            ].filter(Boolean)));
        }

        function getHealthUrl(saveUrl) {
            return saveUrl.replace(/\/save-measurements\/?$/, '/health');
        }

        async function ensureSaveServiceAvailable(showAlert = true) {
            const urls = getSaveServiceUrls();
            for (const saveUrl of urls) {
                try {
                    const response = await fetch(getHealthUrl(saveUrl), {
                        method: 'GET',
                        cache: 'no-store'
                    });
                    if (response.ok) {
                        activeSaveMeasurementsUrl = saveUrl;
                        return true;
                    }
                } catch (error) {
                    // Try the next known service URL.
                }
            }
            if (showAlert) alert(SERVICE_REQUIRED_MESSAGE);
            setMeasureStatus(SERVICE_REQUIRED_MESSAGE);
            return false;
        }

        function isOrthogonalLockActive() {
            return !!(orthogonalLockCheckbox && orthogonalLockCheckbox.checked);
        }

        function isMagneticSnapActive() {
            return !!(magneticSnapCheckbox && magneticSnapCheckbox.checked);
        }

        const SNAP_RADIUS = 1.5;
        const SNAP_RADIUS_SQ = SNAP_RADIUS * SNAP_RADIUS;

        function distSq2D(ax, az, bx, bz) {
            const dx = ax - bx;
            const dz = az - bz;
            return dx * dx + dz * dz;
        }

        function cross2D(ax, az, bx, bz) {
            return ax * bz - az * bx;
        }

        function nearestPointOnSegment(px, pz, ax, az, bx, bz) {
            const abx = bx - ax;
            const abz = bz - az;
            const lenSq = abx * abx + abz * abz;
            if (lenSq <= 1e-8) {
                return { x: ax, z: az, t: 0 };
            }
            let t = ((px - ax) * abx + (pz - az) * abz) / lenSq;
            if (t < 0) t = 0;
            else if (t > 1) t = 1;
            return { x: ax + abx * t, z: az + abz * t, t };
        }

        function findFreeSnap(rawX, rawZ) {
            let bestDistSq = SNAP_RADIUS_SQ;
            let best = null;
            for (let i = 0; i < snapPoints.length; i++) {
                const p = snapPoints[i];
                const d = distSq2D(rawX, rawZ, p.x, p.z);
                if (d < bestDistSq) {
                    bestDistSq = d;
                    best = { x: p.x, z: p.z };
                }
            }
            for (let i = 0; i < snapLines.length; i++) {
                const seg = snapLines[i];
                const near = nearestPointOnSegment(rawX, rawZ, seg.ax, seg.az, seg.bx, seg.bz);
                const d = distSq2D(rawX, rawZ, near.x, near.z);
                if (d < bestDistSq) {
                    bestDistSq = d;
                    best = { x: near.x, z: near.z };
                }
            }
            return best;
        }

        function getNearestSnapLineReference(rawX, rawZ) {
            let bestDistSq = Infinity;
            let best = null;
            for (let i = 0; i < snapLines.length; i++) {
                const seg = snapLines[i];
                const dirX = seg.bx - seg.ax;
                const dirZ = seg.bz - seg.az;
                const length = Math.sqrt(dirX * dirX + dirZ * dirZ);
                if (length <= 1e-6) continue;
                const near = nearestPointOnSegment(rawX, rawZ, seg.ax, seg.az, seg.bx, seg.bz);
                const d = distSq2D(rawX, rawZ, near.x, near.z);
                if (d < bestDistSq) {
                    bestDistSq = d;
                    best = {
                        x: dirX / length,
                        z: dirZ / length
                    };
                }
            }
            return best;
        }

        function getOrthogonalConstraint(start, rawEnd) {
            if (!isOrthogonalLockActive() || !start) return null;
            const referenceDirection = getNearestSnapLineReference(rawEnd.x, rawEnd.z);
            if (!referenceDirection) return null;
            const normalDirection = { x: -referenceDirection.z, z: referenceDirection.x };
            const rawDx = rawEnd.x - start.x;
            const rawDz = rawEnd.z - start.z;
            const parallelProjection = rawDx * referenceDirection.x + rawDz * referenceDirection.z;
            const perpendicularProjection = rawDx * normalDirection.x + rawDz * normalDirection.z;
            const lockDirection = Math.abs(parallelProjection) >= Math.abs(perpendicularProjection)
                ? referenceDirection
                : normalDirection;
            const projection = rawDx * lockDirection.x + rawDz * lockDirection.z;
            const constrainedEnd = rawEnd.clone();
            constrainedEnd.x = start.x + lockDirection.x * projection;
            constrainedEnd.z = start.z + lockDirection.z * projection;
            return {
                constrainedEnd,
                referenceDirection,
                lockDirection
            };
        }

        function findOrthoSnap(start, constrainedEnd, lockDirection) {
            if (!lockDirection) return null;
            const sx = start.x;
            const sz = start.z;
            const dirX = lockDirection.x;
            const dirZ = lockDirection.z;
            let bestDistSq = SNAP_RADIUS_SQ;
            let best = null;

            for (let i = 0; i < snapPoints.length; i++) {
                const p = snapPoints[i];
                const offsetX = p.x - sx;
                const offsetZ = p.z - sz;
                const lateral = Math.abs(cross2D(offsetX, offsetZ, dirX, dirZ));
                if (lateral > SNAP_RADIUS) continue;
                const t = offsetX * dirX + offsetZ * dirZ;
                const candX = sx + dirX * t;
                const candZ = sz + dirZ * t;
                const d = distSq2D(constrainedEnd.x, constrainedEnd.z, candX, candZ);
                if (d < bestDistSq) {
                    bestDistSq = d;
                    best = { x: candX, z: candZ };
                }
            }

            for (let i = 0; i < snapLines.length; i++) {
                const seg = snapLines[i];
                const segDirX = seg.bx - seg.ax;
                const segDirZ = seg.bz - seg.az;
                const denom = cross2D(dirX, dirZ, segDirX, segDirZ);
                if (Math.abs(denom) <= 1e-6) {
                    const lateral = Math.abs(cross2D(seg.ax - sx, seg.az - sz, dirX, dirZ));
                    if (lateral > SNAP_RADIUS) continue;
                    const near = nearestPointOnSegment(constrainedEnd.x, constrainedEnd.z, seg.ax, seg.az, seg.bx, seg.bz);
                    const t = (near.x - sx) * dirX + (near.z - sz) * dirZ;
                    const candX = sx + dirX * t;
                    const candZ = sz + dirZ * t;
                    const d = distSq2D(constrainedEnd.x, constrainedEnd.z, candX, candZ);
                    if (d < bestDistSq) {
                        bestDistSq = d;
                        best = { x: candX, z: candZ };
                    }
                } else {
                    const relX = seg.ax - sx;
                    const relZ = seg.az - sz;
                    const t = cross2D(relX, relZ, segDirX, segDirZ) / denom;
                    const u = cross2D(relX, relZ, dirX, dirZ) / denom;
                    if (u < 0 || u > 1) continue;
                    const candX = sx + dirX * t;
                    const candZ = sz + dirZ * t;
                    const d = distSq2D(constrainedEnd.x, constrainedEnd.z, candX, candZ);
                    if (d < bestDistSq) {
                        bestDistSq = d;
                        best = { x: candX, z: candZ };
                    }
                }
            }
            return best;
        }

        function snapStartPoint(rawPoint) {
            if (!isMagneticSnapActive() || !rawPoint) return rawPoint;
            const hit = findFreeSnap(rawPoint.x, rawPoint.z);
            if (!hit) return rawPoint;
            const p = rawPoint.clone();
            p.x = hit.x;
            p.z = hit.z;
            return p;
        }

        function resolveEndPoint(start, rawEnd) {
            if (!rawEnd) return { point: rawEnd, referenceDirection: null };
            const orthogonalConstraint = isOrthogonalLockActive() && start
                ? getOrthogonalConstraint(start, rawEnd)
                : null;
            const constrained = orthogonalConstraint ? orthogonalConstraint.constrainedEnd : rawEnd;
            if (!isMagneticSnapActive() || !start) {
                return {
                    point: constrained,
                    referenceDirection: orthogonalConstraint ? orthogonalConstraint.referenceDirection : null
                };
            }
            const hit = orthogonalConstraint
                ? findOrthoSnap(start, constrained, orthogonalConstraint.lockDirection)
                : findFreeSnap(constrained.x, constrained.z);
            if (!hit) {
                return {
                    point: constrained,
                    referenceDirection: orthogonalConstraint ? orthogonalConstraint.referenceDirection : null
                };
            }
            const p = constrained.clone();
            p.x = hit.x;
            p.z = hit.z;
            return {
                point: p,
                referenceDirection: orthogonalConstraint ? orthogonalConstraint.referenceDirection : null
            };
        }

        function getGroundPoint(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(ground);
            if (intersects.length === 0) return null;
            const point = intersects[0].point.clone();
            point.y = measureVisualY;

        function getConstrainedEndPoint(start, rawEnd) {
            const orthogonalConstraint = getOrthogonalConstraint(start, rawEnd);
            return orthogonalConstraint ? orthogonalConstraint.constrainedEnd : rawEnd;
        }

        function exitMeasureMode() {

        function disposeObject(object) {
            object.traverse(child => {
                if (child.geometry) child.geometry.dispose();
                if (child.material) {
                    if (child.material.map) child.material.map.dispose();
                    child.material.dispose();
                }
            });
        }

        function clearPreviewMeasurement() {
            if (!previewMeasurement) return;
            removePickablesForGroup(previewMeasurement.group);
            measureLayer.remove(previewMeasurement.group);
            disposeObject(previewMeasurement.group);
            previewMeasurement = null;
            previewDashLine = null;
        }

        function makePoint(point) {
            return new THREE.Vector3(Number(point.x), measureVisualY, Number(point.z));
        }

        function getMeasureInfo(start, end, referenceDirection = null) {
            const dx = end.x - start.x;
            const dz = end.z - start.z;
            const distance = Math.sqrt(dx * dx + dz * dz);
            let angle = distance > 0 ? Math.acos(Math.min(1, Math.abs(dz) / distance)) * 180 / Math.PI : 0;
            if (referenceDirection && distance > 0) {
                const refLength = Math.sqrt(referenceDirection.x * referenceDirection.x + referenceDirection.z * referenceDirection.z);
                if (refLength > 1e-6) {
                    const dot = dx * (referenceDirection.x / refLength) + dz * (referenceDirection.z / refLength);
                    const cosine = Math.max(0, Math.min(1, Math.abs(dot) / distance));
                    angle = Math.acos(cosine) * 180 / Math.PI;
                }
            }
            return { dx, dz, distance, angle };
        }

        function createLineMaterial(color, dashed) {
            const MaterialClass = dashed ? THREE.LineDashedMaterial : THREE.LineBasicMaterial;
            const options = {
                color,
                depthTest: false,
                depthWrite: false,
                transparent: true,
                opacity: dashed ? 0.85 : 1
            };
            if (dashed) {
                options.dashSize = 0.12;
                options.gapSize = 0.08;
                options.scale = 1;
            }
            return new MaterialClass(options);
        }

        function updatePreviewDashBreath() {
            if (!previewDashLine || !previewDashLine.material) return;
            const breath = 0.55 + 0.3 * Math.sin(performance.now() * 0.0022);
            previewDashLine.material.opacity = breath;
        }

        function createTextTexture(text, color) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            const fontSize = 42;
            context.font = `bold ${fontSize}px sans-serif`;
            const width = Math.ceil(context.measureText(text).width + 20);
            const height = 64;
            canvas.width = width;
            canvas.height = height;
            context.font = `bold ${fontSize}px sans-serif`;
            context.textAlign = 'center';
            context.textBaseline = 'bottom';
            context.lineWidth = 6;
            context.strokeStyle = 'rgba(0, 0, 0, 0.7)';
            context.strokeText(text, width / 2, height - 6);
            context.fillStyle = color;
            context.fillText(text, width / 2, height - 6);
            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter;
            texture.needsUpdate = true;
            return { texture, width, height };
        }

        function createMeasureLabel(text, start, end, color) {
            const info = getMeasureInfo(start, end);
            const labelData = createTextTexture(text, color);
            const worldWidth = Math.max(2.0, labelData.width / 110);
            const worldHeight = labelData.height / 110;
            const material = new THREE.MeshBasicMaterial({
                map: labelData.texture,
                transparent: true,
                depthTest: false,
                depthWrite: false,
                side: THREE.DoubleSide
            });
            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(worldWidth, worldHeight), material);

            // Keep the label flat on the ground and always parallel to the measure
            // line (like text sitting on an underline). Avoid Euler XYZ composition
            // of rotation.x + rotation.z, which tilts the plane and makes text cross the line.
            let angle = Math.atan2(info.dz, info.dx);
            if (angle > Math.PI / 2 || angle <= -Math.PI / 2) {
                angle += Math.PI;
            }
            const xAxis = new THREE.Vector3(Math.cos(angle), 0, Math.sin(angle));
            const zAxis = new THREE.Vector3(0, 1, 0);
            const yAxis = new THREE.Vector3().crossVectors(zAxis, xAxis).normalize();
            const mid = new THREE.Vector3(
                (start.x + end.x) / 2,
                measureVisualY + 0.06,
                (start.z + end.z) / 2
            );
            // Text is drawn near the canvas bottom (local -Y); rest that edge on the line.
            mesh.position.copy(mid).addScaledVector(yAxis, -(worldHeight / 2 + 0.04));
            mesh.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(xAxis, yAxis, zAxis));
            mesh.renderOrder = 10002;
            return mesh;
        }

        function createMarker(point, color) {
            const marker = new THREE.Mesh(
                new THREE.CircleGeometry(0.18, 24),
                new THREE.MeshBasicMaterial({
                    color,
                    depthTest: false,
                    depthWrite: false,
                    side: THREE.DoubleSide
                })
            );
            marker.rotation.x = -Math.PI / 2;
            marker.position.copy(point);
            marker.position.y = measureVisualY + 0.02;
            marker.renderOrder = 10001;
            return marker;
        }

        function buildMeasurementVisual(measurement, dashed, selected) {
            const start = makePoint(measurement.start);
            const end = makePoint(measurement.end);
            const color = dashed ? previewMeasureColor : (selected ? selectedMeasureColor : measureColor);
            const group = new THREE.Group();
            group.renderOrder = 10000;
            group.userData.measurementId = measurement.id;

            const geometry = new THREE.BufferGeometry().setFromPoints([start, end]);
            const line = new THREE.Line(geometry, createLineMaterial(color, dashed));
            line.userData.measurementId = measurement.id;
            line.renderOrder = 10000;
            if (dashed) {
                line.computeLineDistances();
                previewDashLine = line;
            }
            group.add(line);
            measurePickables.push(line);

            const startMarker = createMarker(start, color);
            const endMarker = createMarker(end, color);
            startMarker.userData.measurementId = measurement.id;
            endMarker.userData.measurementId = measurement.id;
            group.add(startMarker, endMarker);
            measurePickables.push(startMarker, endMarker);

            const info = getMeasureInfo(start, end, measurement.referenceDirection || null);
            const text = dashed
                ? `${info.distance.toFixed(2)} m  夹角 ${info.angle.toFixed(1)}°`
                : `${info.distance.toFixed(2)} m`;
            const label = createMeasureLabel(text, start, end, selected ? '#ffff00' : '#00ff00');
            label.userData.measurementId = measurement.id;
            group.add(label);
            measurePickables.push(label);

            return group;
        }

        function removePickablesForGroup(group) {
            for (let i = measurePickables.length - 1; i >= 0; i--) {
                if (group.children.includes(measurePickables[i])) {
                    measurePickables.splice(i, 1);
                }
            }
        }

        function addMeasurement(start, end, id, referenceDirection = null) {
            const info = getMeasureInfo(start, end, referenceDirection);
            if (info.distance < 0.05) return null;
            const measurement = {
                id: id || measurementIdSeed++,
                start: { x: start.x, z: start.z },
                end: { x: end.x, z: end.z },
                distance: Number(info.distance.toFixed(4)),
                angle: Number(info.angle.toFixed(2)),
                referenceDirection: referenceDirection ? { x: referenceDirection.x, z: referenceDirection.z } : null,
                group: null
            };
            measurement.group = buildMeasurementVisual(measurement, false, false);
            measureLayer.add(measurement.group);
            measurements.push(measurement);
            measurementIdSeed = Math.max(measurementIdSeed, measurement.id + 1);
            setMeasureStatus(`已添加 ${measurements.length} 根测量线。点击测量线可选中后删除线段。`);
            return measurement;
        }

        function updatePreviewMeasurement(start, end, referenceDirection = null) {
            clearPreviewMeasurement();
            const info = getMeasureInfo(start, end, referenceDirection);
            if (info.distance < 0.05) return;
            previewMeasurement = {
                id: 'preview',
                start: { x: start.x, z: start.z },
                end: { x: end.x, z: end.z },
                referenceDirection: referenceDirection ? { x: referenceDirection.x, z: referenceDirection.z } : null,
                group: null
            };
            previewMeasurement.group = buildMeasurementVisual(previewMeasurement, true, false);
            measureLayer.add(previewMeasurement.group);
        }

        function selectMeasurement(id) {
            selectedMeasurementId = id;
            updateLiabilityButtonsState();
            measurements.forEach(measurement => {
                const selected = measurement.id === id;
                removePickablesForGroup(measurement.group);
                measureLayer.remove(measurement.group);
                disposeObject(measurement.group);
                measurement.group = buildMeasurementVisual(measurement, false, selected);
                measureLayer.add(measurement.group);
            });
            if (id !== null) {
                setMeasureStatus(`已选中第 ${measurements.findIndex(item => item.id === id) + 1} 根测量线，可点击“删除线段”。`);
            }
        }

        function deleteMeasurement(id) {
            const index = measurements.findIndex(item => item.id === id);
            if (index < 0) return;
            const [measurement] = measurements.splice(index, 1);
            removePickablesForGroup(measurement.group);
            measureLayer.remove(measurement.group);
            disposeObject(measurement.group);
            selectedMeasurementId = null;
            updateLiabilityButtonsState();
            setMeasureStatus(`已删除测量线，当前剩余 ${measurements.length} 根。`);
        }

        function selectMeasurementFromClick(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(measurePickables, false);
            const hit = intersects.find(item => item.object.userData.measurementId !== 'preview');
            selectMeasurement(hit ? hit.object.userData.measurementId : null);
        }

        function vehicleEntityFromPointer(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(vehicleRaycastTargets, false);
            const hit = intersects.find(item => item.object && item.object.userData && item.object.userData.vehicleEntity);
            return hit ? hit.object.userData.vehicleEntity : null;
        }

        function serializeMeasurements() {
            return measurements.map(item => ({
                id: item.id,
                start: { x: item.start.x, z: item.start.z },
                end: { x: item.end.x, z: item.end.z },
                distance: item.distance,
                angle: item.angle
            }));
        }

        function suggestSaveFileNameBase(sourcePath) {
            const raw = String(sourcePath || '').replace(/\\/g, '/');
            let stem = raw.split('/').pop() || 'accident';
            stem = stem.replace(/\.html?$/i, '');
            if (stem.endsWith('(line)')) stem = stem.slice(0, -6);
            stem = stem.replace(/_\d{8}_\d{6}$/, '');
            return stem || 'accident';
        }

        function isValidSaveFileNameBase(name) {
            const text = String(name || '').trim();
            if (!text) return { ok: false, error: '文件名不能为空' };
            if (/[\\\/:\*\?"<>|]/.test(text)) {
                return { ok: false, error: '文件名不能包含 \\ / : * ? " < > |' };
            }
            return { ok: true, value: text };
        }

        async function postSaveMeasurements(fileNameBase, overwrite, targetHtmlPath) {
            const response = await fetch(activeSaveMeasurementsUrl || DEFAULT_SAVE_MEASUREMENTS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    sourceHtmlPath: runtimeConfig.sourceHtmlPath || '',
                    measurements: serializeMeasurements(),
                    fileNameBase,
                    overwrite: !!overwrite,
                    targetHtmlPath: targetHtmlPath || ''
                })
            });
            let result = {};
            try {
                result = await response.json();
            } catch (_err) {
                result = {};
            }
            return { response, result };
        }

        async function saveMeasurements() {
            if (!(await ensureSaveServiceAvailable())) return;
            if (!runtimeConfig.sourceHtmlPath) {
                alert('当前 HTML 缺少源文件路径，无法保存测量线。请重新从 Python 程序生成页面。');
                return;
            }
            const suggested = suggestSaveFileNameBase(runtimeConfig.sourceHtmlPath);
            const inputName = window.prompt(
                '请输入保存文件名（最终保存为：名称_时间(line).html）',
                suggested
            );
            if (inputName === null) return;
            const checked = isValidSaveFileNameBase(inputName);
            if (!checked.ok) {
                alert(checked.error);
                return;
            }
            try {
                saveInProgress = true;
                updateLiabilityButtonsState();
                setMeasureStatus('正在保存结果...');
                let { response, result } = await postSaveMeasurements(checked.value, false, '');
                if (response.status === 409 && result && result.needsOverwrite) {
                    const targetName = result.fileName || result.path || checked.value;
                    const confirmed = window.confirm(
                        `文件已存在：\n${targetName}\n是否覆盖？`
                    );
                    if (!confirmed) {
                        setMeasureStatus('已取消保存。');
                        return;
                    }
                    ({ response, result } = await postSaveMeasurements(
                        checked.value,
                        true,
                        result.path || ''
                    ));
                }
                if (!response.ok) {
                    throw new Error(result.error || `HTTP ${response.status}`);
                }
                const savedPath = result.path || '';
                if (savedPath) {
                    runtimeConfig.sourceHtmlPath = savedPath;
                }
                alert(`HTML位置: ${savedPath}\n测量线已保存`);
                setMeasureStatus('保存完成。可继续添加、删除线段，或再次点击“保存结果”。');
            } catch (error) {
                console.error(error);
                const message = (error && error.message && !String(error.message).startsWith('HTTP'))
                    ? String(error.message)
                    : SERVICE_REQUIRED_MESSAGE;
                alert(message);
                setMeasureStatus(message);
            } finally {
                saveInProgress = false;
                updateLiabilityButtonsState();
            }
        }

        window.addEventListener('pointermove', (event) => {
            if (measureMode && measureStart) {
                const point = getGroundPoint(event);
                if (!point) return;
                const endResult = resolveEndPoint(measureStart, point);
                updatePreviewMeasurement(measureStart, endResult.point, endResult.referenceDirection);
                setMeasureStatus(getPreviewStatusText());
                return;
            }
            if (!liabilityMode || event.target !== renderer.domElement) return;
            const vehicleEntity = vehicleEntityFromPointer(event);
            setHoveredVehicleEntity(vehicleEntity, event.clientX, event.clientY);
        });

        window.addEventListener('pointerdown', async (event) => {
            if (event.target !== renderer.domElement) return;
            renderer.domElement.focus();
            if (!measureMode) {
                if (liabilityMode) {
                    if (event.button === 0) setHoveredVehicleEntity(vehicleEntityFromPointer(event), event.clientX, event.clientY);
                    return;
                }
                if (event.button === 0) selectMeasurementFromClick(event);
                return;
            }

            event.preventDefault();
            if (event.button === 2) {
                exitMeasureMode();
                return;
            }
            if (event.button !== 0) return;

            if (!(await ensureSaveServiceAvailable())) {
                exitMeasureMode();
                return;
            }

            const point = getGroundPoint(event);
            if (!point) return;

            if (!measureStart) {
                measureStart = snapStartPoint(point);
                selectedMeasurementId = null;
                updateLiabilityButtonsState();
                setMeasureStatus(isMagneticSnapActive()
                    ? '已确定起点（磁吸已生效），移动鼠标查看虚线预览，点击第二点完成测量线。'
                    : '已确定起点，移动鼠标查看虚线预览，点击第二点完成测量线。');
                return;
            }

            const endResult = resolveEndPoint(measureStart, point);
            addMeasurement(measureStart, endResult.point, undefined, endResult.referenceDirection);
            measureStart = null;
            clearPreviewMeasurement();
        });

        window.addEventListener('contextmenu', (e) => {
            if (measureMode) {
                e.preventDefault();
            }
        });
        renderer.domElement.addEventListener('pointerleave', () => {
            if (liabilityMode) setHoveredVehicleEntity(null);
        });
        window.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                if (liabilityMode) setLiabilityMode(false);
                if (reportModal.classList.contains('is-visible')) closeReportModal();
            }
        });

        const savedMeasurements = Array.isArray(runtimeConfig.savedMeasurements) ? runtimeConfig.savedMeasurements : [];
        savedMeasurements.forEach(item => {
            if (item && item.start && item.end) {
                addMeasurement(makePoint(item.start), makePoint(item.end), Number(item.id) || undefined);
            }
        });
        if (savedMeasurements.length > 0) {
            setMeasureStatus(`已恢复 ${savedMeasurements.length} 根测量线。`);
        }
        updateLiabilityButtonsState();
    </script>
</body>
</html>
